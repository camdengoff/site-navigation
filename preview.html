<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation preview</title>
<!--
  This page exists only so the builder can show a live preview at real phone
  and desktop widths. It is not something you embed on your site.
-->
<link rel="stylesheet" href="nav.css">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .preview-body { padding: 1.25rem; color: #9aa0a6; font-size: 0.8rem; }
</style>
</head>
<body>
  <div id="mount"></div>
  <p class="preview-body">Your page content would continue here.</p>

  <script src="nav.js"></script>
  <script>
    // The builder sends the current settings over; we rebuild the bar with them.
    window.addEventListener("message", function (event) {
      if (event.source !== window.parent) return;
      var config = event.data;
      if (!config || config.type !== "site-nav-preview") return;

      var mount = document.getElementById("mount");
      mount.innerHTML = "";

      var el = document.createElement("div");
      el.setAttribute("data-site-nav", "");
      el.setAttribute("data-links", JSON.stringify(config.links || []));
      if (config.title) el.setAttribute("data-title", config.title);
      if (config.titleUrl) el.setAttribute("data-title-url", config.titleUrl);
      el.setAttribute("data-sticky", config.sticky ? "true" : "false");
      el.setAttribute("data-phone", config.phone === "swipe" ? "swipe" : "dropdown");
      if (config.style) el.setAttribute("style", config.style);

      mount.appendChild(el);
      window.SiteNav.refresh();
    });

    // Tell the builder we are ready to receive settings.
    window.parent.postMessage({ type: "site-nav-preview-ready" }, "*");
  </script>
</body>
</html>
