<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Squarespace markup fixture</title>
<style>
  /* Stands in for a real Squarespace site's own generated typography, which
     commonly sets heading/paragraph color and weight with !important. This is
     exactly what nav.css's own !important rules need to win against - without
     them, a real site's styling like this would silently override the bar's
     chosen colors and bold options. */
  h4 { color: #ff0000 !important; font-weight: 400 !important; }
  p { color: #ff0000 !important; }
</style>
<link rel="stylesheet" href="../nav.css">
</head>
<body class="">

<!-- Case 1: the normal route. Everything the bar needs is on the marker
     itself - this is what the builder's generated Code Block looks like. -->
<section id="case-attrs" data-section-id="def456" class="page-section">
  <div class="sqs-layout"><div class="sqs-block code-block"><div class="sqs-block-content">
    <div data-site-nav
         data-title="Give"
         data-title-tag="h4"
         data-link-tag="p"
         style="--sn-bg:#001122"
         data-links='[{"label":"One Time","url":"/one-time"},{"label":"Recurring","url":"/recurring"}]'></div>
  </div></div></div>
</section>

<!-- Case 2: bold text, real heading/paragraph tags (so the page.css rules
     above actually apply to them), the swipe phone layout, and a new-tab
     link, all set directly on the marker the way the builder writes them. -->
<section id="case-options" data-section-id="ghi789" class="page-section">
  <div class="sqs-layout"><div class="sqs-block code-block"><div class="sqs-block-content">
    <div data-site-nav
         data-title="Ministries"
         data-title-tag="h4"
         data-link-tag="p"
         data-phone="swipe"
         data-bold-label="true"
         data-bold-links="true"
         style="--sn-hover:#0000ff"
         data-links='[{"label":"Youth","url":"/youth"},{"label":"Music","url":"/music","newTab":true},{"label":"Bad link","url":"javascript:alert(1)"}]'></div>
  </div></div></div>
</section>

<!-- Case 3: full-bleed background (now the bar's normal, unconditional
     behavior), deliberately inside a narrow wrapper - the kind of width a
     Squarespace section's content column would impose - wrapped in a
     .fluid-engine div with overflow: clip, matching what Squarespace 7.1
     actually wraps every section in on a real site. -->
<section id="case-fullbleed" style="max-width:300px;margin:0 auto;">
  <div class="fluid-engine" style="overflow:clip">
  <div class="sqs-layout"><div class="sqs-block code-block"><div class="sqs-block-content">
    <div data-site-nav
         data-links='[{"label":"Test","url":"/test"}]'></div>
  </div></div></div>
  </div>
</section>

<!-- Case 4: the Fluid Engine minimum-height problem, shaped like a real
     Squarespace 7.1 section: a .page-section with its own min-height and
     bottom padding, a grid templated to six 24px rows with 11px gaps (199px,
     as measured on the real site), and the bar's block stretched across
     rows 2-7. With the bar as the only block, the whole section should fit
     to the bar's own height. -->
<section id="case-shrink" class="page-section" style="min-height:300px; padding-bottom:40px;">
  <div class="content-wrapper" style="padding-top:20px; padding-bottom:50px; min-height:250px;">
    <div class="content">
      <div class="fluid-engine" style="display:grid; grid-template-columns:1fr; grid-template-rows: 24px 24px 24px 24px 24px 24px 24px; row-gap:11px;">
        <div class="fe-block" style="grid-row:2 / 8; grid-column:1; min-height:100px;">
          <div class="sqs-block code-block" style="height:100%"><div class="sqs-block-content">
            <div data-site-nav
                 data-shrink-block="true"
                 data-links='[{"label":"Test","url":"/test"}]'></div>
          </div></div>
        </div>
      </div>
      <!-- Spacing that isn't any wrapper's own padding or height - the kind
           Squarespace's Mobile layout adds. -->
      <div class="mobile-spacer" style="height:60px"></div>
    </div>
  </div>
</section>
<script>
  // Squarespace's own scripts rewrite section styles after the page loads.
  setTimeout(function () {
    var section = document.getElementById("case-shrink");
    section.style.minHeight = "300px";
    section.querySelector(".fluid-engine").style.rowGap = "11px";
  }, 300);
</script>

<!-- Case 5: same shape, but a second block shares the section. The shrink
     must not touch it - the rows are there for that other block too. -->
<section id="case-shared" class="page-section" style="min-height:300px; padding-bottom:40px;">
  <div class="content-wrapper" style="padding-bottom:50px;">
    <div class="content">
      <div class="fluid-engine" style="display:grid; grid-template-columns:1fr; grid-template-rows: 24px 24px 24px 24px 24px 24px; row-gap:11px;">
        <div class="fe-block" style="grid-row:1 / 3; grid-column:1;">
          <div class="sqs-block code-block"><div class="sqs-block-content">
            <div data-site-nav
                 data-shrink-block="true"
                 data-links='[{"label":"Test","url":"/test"}]'></div>
          </div></div>
        </div>
        <div class="fe-block" style="grid-row:3 / 7; grid-column:1;">
          <div class="sqs-block html-block"><div class="sqs-block-content"><p>Another block</p></div></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Case 6: a bar an older copy of the script already built (e.g. one
     left in Code Injection, which runs first). This copy must take it over
     and rebuild it rather than skip it. -->
<section id="case-takeover" class="page-section">
  <div data-site-nav data-site-nav-ready="true"
       data-links='[{"label":"Fresh","url":"/fresh"}]'><span class="old-build">old</span></div>
</section>

<script src="../nav.js"></script>
</body>
</html>
